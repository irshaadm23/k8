
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-lab
  namespace: default
  labels:
    app: nginx-lab

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx-lab

  template:
    metadata:
      labels:
        app: nginx-lab

    spec:
      containers:
        - name: nginx
          image: nginx:1.28
          ports:
            - containerPort: 80
